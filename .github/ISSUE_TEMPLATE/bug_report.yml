name: Bug report
description: Report a reproducible problem in a skill or validator
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Affected skill
      options:
        - token-efficient-codex
        - tibo-reset
        - context-handoff
        - regression-guardian
        - repo-first-debugging
        - validator/repository tooling
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Reproduction / pressure scenario
      description: Describe the smallest task that exposes the problem. Remove private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private repository content, customer data, and sensitive local paths.
          required: true
